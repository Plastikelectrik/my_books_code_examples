<!-- Book: JavaScript for Absolute Beginners — Example 32 -->
<!-- quiz.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1">
    <title>Copper Kettle Coffee Quiz</title>
    <link rel="stylesheet" href="quiz.css">
  </head>
  <body>
    <main id="app">
      <section id="start-screen">
        <h1>☕ Coffee Quiz</h1>
        <p>How much do you know about coffee?</p>
        <p id="best-score"></p>
        <button id="start-btn">Start the quiz</button>
      </section>

      <section id="question-screen" class="hidden">
        <p id="progress"></p>
        <h2 id="question-text"></h2>
        <div id="options"></div>
        <p id="explanation" class="hidden"></p>
        <button id="next-btn" class="hidden">Next</button>
      </section>

      <section id="result-screen" class="hidden">
        <h2 id="result-title"></h2>
        <p id="result-text"></p>
        <button id="again-btn">Play again</button>
      </section>
    </main>
    <script src="quiz.js"></script>
  </body>
</html>

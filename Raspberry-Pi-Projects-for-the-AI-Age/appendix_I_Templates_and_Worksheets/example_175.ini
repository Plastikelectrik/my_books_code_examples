[Unit]
Description=My project
After=network-online.target
Wants=network-online.target

[Service]
User=oscar
WorkingDirectory=/home/oscar/my-project
ExecStart=/home/oscar/my-project/.venv/bin/python main.py
Restart=on-failure
RestartSec=10
# optional hardening for services without hardware access
NoNewPrivileges=true
ProtectSystem=full
PrivateTmp=true

[Install]
WantedBy=multi-user.target

[Unit]
Description=Home chatbot web server
After=network-online.target ollama.service

[Service]
User=oscar
WorkingDirectory=/home/oscar/chatbot
Environment=CHATBOT_PASSWORD=choose-a-long-password
ExecStart=/home/oscar/chatbot/.venv/bin/gunicorn \
  -w 1 --threads 4 -b 0.0.0.0:8443 \
  --certfile cert.pem --keyfile key.pem \
  --timeout 300 app:app
Restart=on-failure

[Install]
WantedBy=multi-user.target
